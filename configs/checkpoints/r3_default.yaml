project_name: semifab_cmp_poc
schema_version: 2.1.0
interface_version: 2.0.0
seed: 0
dt_s: 0.01
duration_s: 10.0
log_level: INFO
artifact_dir: artifacts
synthetic_only: true
scenario_library: configs/scenarios/library.yaml
phm_data_config: configs/data/phm_2016_cmp.yaml

electrical:
  provenance_id: synthetic-electrical-energy-v2
  nominal_voltage_pu: 1.0
  nominal_frequency_hz: 50.0
  voltage_min_pu: 0.0
  voltage_max_pu: 1.5
  frequency_min_hz: 0.0
  frequency_max_hz: 100.0
  transfer_threshold_pu: 0.85
  recovery_threshold_pu: 0.95
  transfer_delay_s: 0.05
  recovery_delay_s: 0.25
  output_time_constant_s: 0.05
  frequency_time_constant_s: 0.10
  transfer_output_pu: 0.80
  battery_output_pu: 1.00
  ups_rated_power_w: 3000.0
  ups_overload_trip_ratio: 1.20
  nominal_ups_load_w: 2500.0
  battery_capacity_j: 3600000.0
  initial_battery_energy_j: 3600000.0
  minimum_battery_energy_j: 0.0
  inverter_efficiency: 0.95
  maximum_charge_power_w: 500.0

drive:
  provenance_id: synthetic-drive-v1
  nominal_motor_speed_rad_s: 188.5
  motor_time_constant_s: 0.20
  ramp_up_rate_rad_s2: 500.0
  ramp_down_rate_rad_s2: 1000.0
  undervoltage_trip_threshold_pu: 0.50
  derating_start_voltage_pu: 0.90
  derating_exponent: 1.0
  restart_delay_s: 0.25
  max_speed_ratio: 1.20

pump:
  provenance_id: synthetic-pump-curve-v2
  reference_motor_speed_rad_s: 188.5
  reference_flow_m3_s: 2.0e-4
  reference_head_pa: 2.0e5
  shutoff_head_pa: 4.0e5
  hydraulic_efficiency: 0.70
  maximum_flow_m3_s: 5.0e-4
  max_speed_ratio: 1.20
  operating_point_tolerance_pa: 1.0e-6

upw:
  provenance_id: synthetic-upw-conserved-v2
  nominal_supply_pressure_pa: 300000.0
  nominal_return_pressure_pa: 100000.0
  maximum_supply_pressure_pa: 600000.0
  hydraulic_compliance_m3_pa: 2.0e-10
  return_resistance_pa_s_m3: 2.0e9
  tool_resistance_pa_s_m3: 1.0e9
  reference_pump_flow_m3_s: 2.0e-4
  maximum_flow_m3_s: 5.0e-4
  nominal_tool_demand_m3_s: 1.0e-4
  relief_set_pressure_pa: 500000.0
  relief_resistance_pa_s_m3: 5.0e8
  hydraulic_balance_tolerance_m3_s: 1.0e-12
  maximum_hydraulic_timestep_s: 0.05
  hydraulic_solver_max_iterations: 100
  nominal_temperature_k: 293.15
  thermal_capacity_j_k: 5000.0
  water_density_kg_m3: 997.0
  water_specific_heat_j_kg_k: 4180.0
  ambient_thermal_conductance_w_k: 50.0
  minimum_temperature_k: 273.15
  maximum_temperature_k: 373.15
  nominal_water_quality_deviation_proxy: 0.0
  water_quality_proxy_time_constant_s: 60.0
  maximum_water_quality_deviation_proxy: 1.0

sensors:
  - sensor_id: upw-supply-pressure
    signal_id: upw.supply_pressure
    unit: Pa
    sample_period_s: 0.01
    provenance_id: synthetic-pressure-sensor-v1
    noise_std: 0.0
    bias: 0.0
    drift_per_s: 0.0
    quantization_step: null
    delay_s: 0.0
    packet_loss_probability: 0.0
    stuck_probability: 0.0
    timestamp_jitter_std_s: 0.0
    minimum_value: 0.0
    maximum_value: 600000.0
  - sensor_id: upw-tool-flow
    signal_id: upw.tool_flow
    unit: m^3/s
    sample_period_s: 0.01
    provenance_id: synthetic-flow-sensor-v1
    noise_std: 0.0
    bias: 0.0
    drift_per_s: 0.0
    quantization_step: null
    delay_s: 0.0
    packet_loss_probability: 0.0
    stuck_probability: 0.0
    timestamp_jitter_std_s: 0.0
    minimum_value: 0.0
    maximum_value: 5.0e-4
  - sensor_id: upw-temperature
    signal_id: upw.temperature
    unit: K
    sample_period_s: 0.10
    provenance_id: synthetic-temperature-sensor-v1
    noise_std: 0.0
    bias: 0.0
    drift_per_s: 0.0
    quantization_step: null
    delay_s: 0.0
    packet_loss_probability: 0.0
    stuck_probability: 0.0
    timestamp_jitter_std_s: 0.0
    minimum_value: 273.15
    maximum_value: 373.15
