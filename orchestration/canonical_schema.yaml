schema_version: "2.4.0"
status: FROZEN_WP10_V2_4
implementation_gate: WP10_IMPLEMENTATION_AND_VALIDATION
supersedes: "2.3.0"
change_decision: orchestration/decisions/wp10_utility_cmp_coupling.md
effective_date: "2026-07-11"
owner: sole_engineering_agent
change_control:
  requires:
    - decision_record
    - impact_analysis
    - updated_tests
    - updated_downstream_documentation

conventions:
  simulator_internal_units: SI
  public_source_units: preserve_native_or_unknown_until_supported_conversion
  time_primary_key: step_index
  timestamp_definition: "timestamp_s = step_index * dt_s from run start"
  mrr_canonical_unit: m/s
  mrr_reporting_unit: nm/min
  mrr_conversion: "1 m/s = 6.0e10 nm/min"
  temperature_unit: K
  pressure_unit: Pa
  volumetric_flow_unit: m^3/s
  angular_speed_unit: rad/s
  fraction_range: [0.0, 1.0]
  per_unit_nominal: 1.0
  missing_numeric_representation: null
  infinity_allowed: false
  unknown_keys_allowed: false

semantic_classes:
  - MEASURED_PROCESS_OUTPUT
  - SIMULATED_PHYSICAL_STATE
  - OBSERVED_SENSOR_STATE
  - PROCESS_EXCURSION
  - QUALITY_RISK_PROXY
  - PHYSICAL_DEFECT
  - YIELD_OUTCOME
  - MODEL_OUTPUT
  - CONTROL_ACTION
  - SAFETY_DECISION

data_origins:
  - PUBLIC_MEASURED
  - SYNTHETIC_SIMULATOR
  - DERIVED_PUBLIC_DATA
  - DERIVED_SYNTHETIC
  - CONFIGURATION

quality_flags:
  - VALID
  - MISSING
  - DELAYED
  - DROPPED
  - STUCK
  - BIASED
  - DRIFTING
  - QUANTISED
  - OUT_OF_RANGE
  - TIMESTAMP_JITTERED
  - UNIT_UNRESOLVED
  - INVALID

records:
  run_manifest:
    description: Reproducibility and provenance envelope for one execution.
    primary_key: [run_id]
    fields:
      run_id: {type: string, required: true}
      scenario_id: {type: string, required: true}
      controller_id: {type: string, required: true}
      config_sha256: {type: string, pattern: "^[0-9a-f]{64}$", required: true}
      code_revision: {type: string, required: true, note: "commit hash or explicit UNCOMMITTED"}
      run_seed: {type: integer, minimum: 0, required: true}
      child_seed_map: {type: mapping_string_integer, required: true}
      dt_s: {type: float, exclusive_minimum: 0.0, unit: s, required: true}
      duration_s: {type: float, exclusive_minimum: 0.0, unit: s, required: true}
      started_at_utc: {type: datetime, required: true}
      software_versions: {type: mapping_string_string, required: true}
      dataset_manifest_ids: {type: list_string, required: true}
      parameter_provenance_ids: {type: mapping_string_string, minimum_size: 1, required: true}
      synthetic_only: {type: boolean, required: true}

  latent_state_record:
    description: Simulator truth; never exposed directly to online prediction or control.
    primary_key: [run_id, step_index, signal_id]
    fixed_semantic_class: SIMULATED_PHYSICAL_STATE
    fixed_data_origin: SYNTHETIC_SIMULATOR
    fields:
      run_id: {type: string, required: true}
      step_index: {type: integer, minimum: 0, required: true}
      timestamp_s: {type: float, minimum: 0.0, unit: s, required: true}
      signal_id: {type: signal_identifier, required: true}
      value: {type: scalar, finite_if_numeric: true, required: true}
      unit: {type: string, required: true}
      subsystem: {type: string, required: true}
      provenance_id: {type: string, required: true}

  observation_record:
    description: Sensor/communication output available to online consumers.
    primary_key: [run_id, sample_index, sensor_id]
    fixed_semantic_class: OBSERVED_SENSOR_STATE
    fields:
      run_id: {type: string, required: true}
      sample_index: {type: integer, minimum: 0, required: true}
      source_step_index: {type: integer, minimum: 0, nullable: true, required: true}
      source_timestamp_s: {type: float, minimum: 0.0, unit: s, nullable: true, required: false, note: "R4-generated records always populate; legacy records without it are not online-eligible"}
      observed_timestamp_s: {type: float, minimum: 0.0, unit: s, required: true, semantic_name: reported_sensor_timestamp}
      arrival_timestamp_s: {type: float, minimum: 0.0, unit: s, required: true}
      sensor_id: {type: string, required: true}
      signal_id: {type: signal_identifier, required: true}
      value: {type: scalar, finite_if_numeric: true, nullable: true, required: true}
      unit: {type: string, required: true}
      quality_flags: {type: list_quality_flag, required: true}
      uncertainty_std: {type: float, minimum: 0.0, nullable: true, required: true}
      data_origin: {type: enum_data_origin, required: true}

  public_measurement_record:
    description: Verified public-dataset process measurement; never simulator truth.
    primary_key: [dataset_id, source_row_id, signal_id]
    fixed_semantic_class: MEASURED_PROCESS_OUTPUT
    fixed_data_origin: PUBLIC_MEASURED
    fields:
      dataset_id: {type: string, required: true}
      source_file_sha256: {type: string, pattern: "^[0-9a-f]{64}$", required: true}
      source_row_id: {type: string, required: true}
      wafer_id: {type: string, nullable: true, required: true}
      machine_id: {type: string, nullable: true, required: true}
      trace_id: {type: string, nullable: true, required: true}
      source_timestamp: {type: datetime_or_numeric, nullable: true, required: true}
      signal_id: {type: signal_identifier, required: true}
      value: {type: scalar, finite_if_numeric: true, nullable: true, required: true}
      source_unit: {type: string, required: true}
      source_unit_status: {type: enum_source_unit_status, required: true}
      canonical_value: {type: float, finite: true, nullable: true, required: true}
      canonical_unit: {type: string, nullable: true, required: true}
      conversion_id: {type: string, nullable: true, required: true}
      quality_flags: {type: list_quality_flag, required: true}
    validation_rules:
      - source_value_is_validated_without_assigning_canonical_units
      - available_unconverted_value_requires_UNIT_UNRESOLVED_not_MISSING
      - null_canonical_value_requires_null_canonical_unit_and_conversion_id
      - canonical_value_requires_DECLARED_source_unit_and_nonempty_conversion_id
      - canonical_unit_must_match_signal_catalog

  prediction_record:
    description: Online prediction produced only from available observations.
    primary_key: [run_id, decision_step_index, predictor_id, target_id]
    fixed_semantic_class: MODEL_OUTPUT
    fields:
      run_id: {type: string, required: true}
      decision_step_index: {type: integer, minimum: 0, required: true}
      decision_timestamp_s: {type: float, minimum: 0.0, unit: s, required: true}
      predictor_id: {type: string, required: true}
      predictor_version: {type: string, required: true}
      target_id: {type: string, required: true}
      horizon_s: {type: float, minimum: 0.0, unit: s, required: true}
      point_value: {type: float, finite: true, nullable: true, required: true}
      lower_value: {type: float, finite: true, nullable: true, required: true}
      upper_value: {type: float, finite: true, nullable: true, required: true}
      unit: {type: string, required: true}
      excursion_probability: {type: float, minimum: 0.0, maximum: 1.0, nullable: true, required: true}
      uncertainty_valid: {type: boolean, required: true}
      feature_cutoff_step_index: {type: integer, minimum: 0, required: true}
      latency_s: {type: float, minimum: 0.0, unit: s, required: true}

  attribution_record:
    description: Cause classification against a fixed simulator cause vocabulary.
    primary_key: [run_id, decision_step_index, estimator_id]
    fields:
      run_id: {type: string, required: true}
      decision_step_index: {type: integer, minimum: 0, required: true}
      estimator_id: {type: string, required: true}
      predicted_cause: {type: enum_root_cause, required: true}
      probability_by_cause: {type: mapping_cause_probability, required: true}
      rule_chain_ids: {type: list_string, required: true}
      residual_evidence: {type: mapping_string_float, required: true}
      attribution_method: {type: string, required: true}
      causal_proof: {type: literal_false, required: true}

  action_record:
    description: Proposed or final supervisory action; no direct hardware command.
    primary_key: [run_id, decision_step_index, stage, action_id]
    fixed_semantic_class: CONTROL_ACTION
    fields:
      run_id: {type: string, required: true}
      decision_step_index: {type: integer, minimum: 0, required: true}
      effective_step_index: {type: integer, minimum: 1, required: true}
      stage: {type: enum, values: [PROPOSED, FINAL], required: true}
      action_id: {type: string, required: true}
      action_type: {type: enum_action_type, required: true}
      target: {type: string, required: true}
      value: {type: float, finite: true, nullable: true, required: true}
      unit: {type: string, required: true}
      rationale: {type: string, required: true}
      controller_id: {type: string, required: true}

  safety_decision_record:
    description: Independent disposition of a proposed action.
    primary_key: [run_id, decision_step_index, proposed_action_id]
    fixed_semantic_class: SAFETY_DECISION
    fields:
      run_id: {type: string, required: true}
      decision_step_index: {type: integer, minimum: 0, required: true}
      proposed_action_id: {type: string, required: true}
      outcome: {type: enum_safety_outcome, required: true}
      final_action_id: {type: string, required: true}
      violated_constraint_ids: {type: list_string, required: true}
      sensor_valid: {type: boolean, required: true}
      uncertainty_acceptable: {type: boolean, required: true}
      process_envelope_valid: {type: boolean, required: true}
      latency_s: {type: float, minimum: 0.0, unit: s, required: true}

  scenario_event_record:
    description: Validated deterministic exogenous disturbance or fault event.
    primary_key: [scenario_id, event_id]
    fields:
      scenario_id: {type: string, required: true}
      event_id: {type: string, required: true}
      event_type: {type: string, required: true}
      start_s: {type: float, minimum: 0.0, unit: s, required: true}
      duration_s: {type: float, minimum: 0.0, unit: s, required: true}
      priority: {type: integer, required: true}
      target: {type: string, required: true}
      profile: {type: enum, values: [STEP, RAMP, PULSE, PIECEWISE_LINEAR], required: true}
      magnitude: {type: scalar, required: true}
      unit: {type: string, required: true}
      initiating_cause: {type: enum_root_cause, required: true}
      declaration_order: {type: integer, minimum: 0, required: true}

  excursion_label_record:
    description: Future-envelope target generated without exposing future state to online features.
    primary_key: [run_id, decision_step_index, target_id, horizon_s]
    fixed_semantic_class: PROCESS_EXCURSION
    fields:
      run_id: {type: string, required: true}
      decision_step_index: {type: integer, minimum: 0, required: true}
      target_id: {type: string, required: true}
      horizon_s: {type: float, exclusive_minimum: 0.0, unit: s, required: true}
      excursion_within_horizon: {type: boolean, required: true}
      first_excursion_step_index: {type: integer, minimum: 0, nullable: true, required: true}
      envelope_id: {type: string, required: true}
      generated_offline: {type: literal_true, required: true}

enumerations:
  source_unit_status:
    - DECLARED
    - NATIVE_UNDECLARED
    - UNKNOWN
  root_cause:
    - GRID_VOLTAGE_SAG
    - GRID_VOLTAGE_SWELL
    - GRID_INTERRUPTION
    - GRID_FREQUENCY_DEVIATION
    - UPS_TRANSFER
    - VFD_DERATING
    - PUMP_TRIP
    - VALVE_RESTRICTION
    - TOOL_DEMAND_SPIKE
    - THERMAL_EXCURSION
    - PRESSURE_SENSOR_FAULT
    - FLOW_SENSOR_FAULT
    - UNKNOWN
  action_type:
    - NO_ACTION
    - VFD_COMMAND_ADJUSTMENT
    - VALVE_ADJUSTMENT
    - CMP_DOWNFORCE_REDUCTION
    - HEAD_SPEED_REDUCTION
    - PLATEN_SPEED_REDUCTION
    - ADVISORY_WARNING
    - SAFE_HOLD
    - CONTROLLED_RESUME
  safety_outcome:
    - APPROVED
    - CLIPPED
    - REJECTED_OUT_OF_ENVELOPE
    - REJECTED_SENSOR_INVALID
    - REJECTED_HIGH_UNCERTAINTY
    - REPLACED_WITH_HOLD

signal_catalog:
