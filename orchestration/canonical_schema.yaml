  - {id: upw.relief_flow, subsystem: upw, dtype: float, unit: m^3/s, valid_range: [0.0, null]}
  - {id: upw.storage_flow, subsystem: upw, dtype: float, unit: m^3/s, valid_range: [null, null]}
  - {id: upw.mass_balance_residual, subsystem: upw, dtype: float, unit: m^3/s, valid_range: [null, null]}
  - {id: upw.temperature, subsystem: upw, dtype: float, unit: K, valid_range: [273.15, 373.15]}
