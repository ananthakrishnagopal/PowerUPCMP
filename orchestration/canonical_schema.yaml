  - {id: cmp.thermal_energy_residual, subsystem: cmp, dtype: float, unit: W, valid_range: [null, null]}
  - {id: cmp.mrr, subsystem: cmp, dtype: float, unit: m/s, valid_range: [0.0, null]}
  - {id: cmp.mrr_physics, subsystem: cmp, dtype: float, unit: m/s, valid_range: [0.0, null]}
  - {id: cmp.mrr_deviation, subsystem: cmp, dtype: float, unit: m/s, valid_range: [null, null]}
  - {id: cmp.cumulative_removal, subsystem: cmp, dtype: float, unit: m, valid_range: [0.0, null]}
  - {id: cmp.active_polish_time, subsystem: cmp, dtype: float, unit: s, valid_range: [0.0, null]}
  - {id: cmp.stage_average_mrr, subsystem: cmp, dtype: float, unit: m/s, valid_range: [0.0, null]}
  - id: cmp.spatial_uniformity_proxy
    subsystem: cmp
    dtype: float
    unit: "1"
    valid_range: [0.0, null]
    proxy: true
    mandatory_label: "Simulated spatial-uniformity proxy; not experimentally validated WIWNU."

split_contract:
  forbidden: random_row_split_within_trace
  allowed_primary_group_keys_in_priority_order:
    - wafer_id
    - machine_id
    - trace_id
    - source_time_block
  fit_scope:
    preprocessing: training_groups_only
    physics_calibration: training_groups_only
    residual_model: training_groups_only
    uncertainty_calibration: dedicated_calibration_groups_only
  audit_requirements:
    - zero_group_overlap
    - feature_timestamp_not_after_prediction_cutoff
    - labels_joined_after_split_key_preservation
    - duplicate_source_rows_reported
    - missingness_reported_by_split

spatial_proxy_policy:
  measured_spatial_metrology_available: false
  semantic_class: QUALITY_RISK_PROXY
  required_label: "Simulated spatial-uniformity proxy; not experimentally validated WIWNU."
  forbidden_terms_without_qualification:
    - measured_WIWNU
    - validated_WIWNU
    - defect_prevention
