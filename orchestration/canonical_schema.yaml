  - {id: cmp.pad_remaining_life, subsystem: cmp, dtype: float, unit: "1", valid_range: [0.0, 1.0], proxy: true}
  - {id: cmp.dresser_effectiveness, subsystem: cmp, dtype: float, unit: "1", valid_range: [0.0, 1.0], proxy: true}
  - {id: cmp.dressing_activity, subsystem: cmp, dtype: float, unit: "1", valid_range: [0.0, 1.0]}
  - {id: cmp.pad_age, subsystem: cmp, dtype: float, unit: s, valid_range: [0.0, null], deprecated: true, emitted_by_wp08: false}
  - {id: cmp.dresser_age, subsystem: cmp, dtype: float, unit: s, valid_range: [0.0, null], deprecated: true, emitted_by_wp08: false}
