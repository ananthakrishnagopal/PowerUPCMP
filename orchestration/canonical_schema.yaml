  - {id: cmp.contact_pressure, subsystem: cmp, dtype: float, unit: Pa, valid_range: [0.0, null]}
  - {id: cmp.relative_velocity, subsystem: cmp, dtype: float, unit: m/s, valid_range: [0.0, null]}
