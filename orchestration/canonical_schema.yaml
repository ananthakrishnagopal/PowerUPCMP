  - {id: electrical.grid_frequency, subsystem: electrical, dtype: float, unit: Hz, valid_range: [0.0, 100.0]}
  - {id: electrical.ups_output_voltage, subsystem: electrical, dtype: float, unit: pu, valid_range: [0.0, 1.5]}
  - {id: electrical.ups_output_frequency, subsystem: electrical, dtype: float, unit: Hz, valid_range: [0.0, 100.0]}
  - {id: electrical.ups_battery_energy, subsystem: electrical, dtype: float, unit: J, valid_range: [0.0, null]}
  - {id: electrical.ups_load_power, subsystem: electrical, dtype: float, unit: W, valid_range: [0.0, null]}
  - {id: electrical.ups_mode, subsystem: electrical, dtype: enum, unit: "1", values: [GRID, TRANSFER, BATTERY, BYPASS, RECOVERY]}
  - {id: drive.vfd_command, subsystem: drive, dtype: float, unit: pu, valid_range: [0.0, 1.0]}
  - {id: drive.vfd_available_output, subsystem: drive, dtype: float, unit: pu, valid_range: [0.0, 1.0]}
  - {id: drive.vfd_derating, subsystem: drive, dtype: float, unit: "1", valid_range: [0.0, 1.0]}
  - {id: drive.vfd_trip_state, subsystem: drive, dtype: boolean, unit: "1"}
  - {id: drive.motor_angular_speed, subsystem: drive, dtype: float, unit: rad/s, valid_range: [0.0, null]}
  - {id: pump.speed_ratio, subsystem: pump, dtype: float, unit: "1", valid_range: [0.0, 1.2]}
  - {id: pump.volumetric_flow, subsystem: pump, dtype: float, unit: m^3/s, valid_range: [0.0, null]}
  - {id: pump.head, subsystem: pump, dtype: float, unit: Pa, valid_range: [0.0, null]}
  - {id: pump.power, subsystem: pump, dtype: float, unit: W, valid_range: [0.0, null]}
  - {id: pump.operating_point_residual, subsystem: pump, dtype: float, unit: Pa, valid_range: [null, null]}
  - {id: upw.supply_pressure, subsystem: upw, dtype: float, unit: Pa, valid_range: [0.0, null]}
  - {id: upw.return_pressure, subsystem: upw, dtype: float, unit: Pa, valid_range: [0.0, null]}
  - {id: upw.tool_flow, subsystem: upw, dtype: float, unit: m^3/s, valid_range: [0.0, null]}
  - {id: upw.valve_position, subsystem: upw, dtype: float, unit: "1", valid_range: [0.0, 1.0]}
  - {id: upw.tool_demand, subsystem: upw, dtype: float, unit: m^3/s, valid_range: [0.0, null]}
