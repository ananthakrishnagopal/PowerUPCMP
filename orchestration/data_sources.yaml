    - reject_sources_without_approved_authoritative_url
    - display_source_licence_and_expected_size_before_transfer
    - preserve_raw_files_without_overwrite
    - record_access_date_in_UTC
    - compute_SHA256_streaming
    - validate_exact_expected_filenames
