manifest_version: "1.0.0"
last_updated: "2026-07-12T13:15:47+05:30"
workflow: single_agent_phase_gated
allowed_states:
  - PLANNED
  - READY
  - IN_PROGRESS
  - IMPLEMENTED
  - VALIDATED
  - BLOCKED
  - FAILED
  - COMPLETE
state_transition_policy:
  - "PLANNED -> READY when all dependencies are COMPLETE and blockers are empty"
  - "READY -> IN_PROGRESS before mutation"
  - "IN_PROGRESS -> IMPLEMENTED when deliverables exist"
  - "IMPLEMENTED -> VALIDATED only after all acceptance tests pass"
  - "VALIDATED -> COMPLETE when no task-local work remains"
  - "Any active state -> FAILED only through the documented failure policy"
  - "BLOCKED requires an explicit blocker and recovery condition"

post_completion_audit:
  date: "2026-07-11"
  report: orchestration/reports/phase_1_2_scientific_audit.md
  phase_2_checkpoint_disposition: PROVISIONAL_PENDING_CORRECTIVE_VALIDATION
  affected_historical_tasks: [T-WP01, T-WP02, T-WP03, T-WP04, T-WP05, T-WP06, T-WP07, T-WP11]
  policy: Historical COMPLETE states preserve the execution record; they do not satisfy downstream scientific gates until T-PHASE12-REMEDIATION is COMPLETE.
  downstream_gate_task: T-PHASE12-REMEDIATION

