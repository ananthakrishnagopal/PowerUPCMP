[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semifab-poc"
version = "0.1.0"
description = "Simulation-first semiconductor CMP predictive-control proof of concept"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Internal research PoC; see repository documentation"}
authors = [{name = "Semifab PoC engineering"}]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.10",
  "pandas>=2.0",
  "pydantic>=2.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
models = ["scikit-learn>=1.4"]
dashboard = ["plotly>=5.18"]

[project.scripts]
semifab-poc = "semifab_poc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
